<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>筛选表格 · 市场 W+</title><link rel="stylesheet" href="./cdn/reset.css"><link rel="stylesheet" href="./theme.css"></head><body><div id="root"><div class="boot">正在加载市场 W+ 页面…</div></div><noscript>请启用 JavaScript 以使用页面。</noscript>
<script src="./cdn/react.production.min.js"></script><script src="./cdn/react-dom.production.min.js"></script><script src="./cdn/dayjs.min.js"></script><script src="./cdn/antd5.min.js"></script><script src="./cdn/babel.min.js"></script>
<script type="text/babel">

const {useState,useEffect,useRef}=React;
const {App:AntApp,ConfigProvider,Button,Space,Form,Input,InputNumber,Select,Radio,Switch,DatePicker,Upload,Modal,Table,Tag,Alert,Progress,Steps,Result,Descriptions,Dropdown,Popover,Checkbox,Empty,Tooltip,Badge}=antd;
const {RangePicker}=DatePicker;
const {Dragger}=Upload;
const pages=[['batch-import','批量导入'],['basic-form','基础表单'],['complex-form','复杂表单'],['filter-table','筛选表格'],['select-list','选择列表']];
const locale={locale:'zh-cn',Pagination:{items_per_page:'条/页',jump_to:'跳至',jump_to_confirm:'确定',page:'页',prev_page:'上一页',next_page:'下一页',prev_5:'向前 5 页',next_5:'向后 5 页'},Table:{filterTitle:'筛选',filterConfirm:'确定',filterReset:'重置',filterEmptyText:'暂无筛选项',emptyText:'暂无内容',selectAll:'全选当页',selectInvert:'反选当页',selectNone:'清空所有',triggerDesc:'点击降序',triggerAsc:'点击升序',cancelSort:'取消排序'},Select:{notFoundContent:'暂无选项'},Empty:{description:'暂无内容'},DatePicker:{lang:{locale:'zh_CN',placeholder:'请选择日期',rangePlaceholder:['开始日期','结束日期'],today:'今天',now:'此刻',backToToday:'返回今天',ok:'确定',clear:'清除',month:'月',year:'年',timeSelect:'选择时间',dateSelect:'选择日期',monthSelect:'选择月份',yearSelect:'选择年份',decadeSelect:'选择年代',yearFormat:'YYYY年',dateFormat:'YYYY年M月D日',dayFormat:'D日',dateTimeFormat:'YYYY年M月D日 HH时mm分ss秒',monthBeforeYear:false,shortWeekDays:['日','一','二','三','四','五','六'],shortMonths:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']},timePickerLocale:{placeholder:'请选择时间'}}};
function Shell({id,title,description,extra,children}){return <><header className="topbar"><div className="brand"><span className="brand-icon">W⁺</span><div><div className="brand-name">市场</div><div className="brand-sub">Payroll Finance</div></div></div><nav className="nav" aria-label="页面导航">{pages.map(([key,name])=><a key={key} className={key===id?'active':''} aria-current={key===id?'page':undefined} href={'./'+key+'.html'}>{name}</a>)}</nav><div className="profile"><span className="small muted">本地演示</span><span className="avatar">林</span><span>林晓 / 市场运营</span></div></header><main className="page"><div className="breadcrumb">市场经营&nbsp; / &nbsp;<span>{title}</span></div><div className="page-heading"><div><h1>{title}</h1><div className="muted small">{description}</div></div>{extra}</div>{children}</main></>}
function Section({children}){return <h2 className="section-title">{children}</h2>}
function Optional({children}){return <>{children}<span className="optional">（选填）</span></>}
function download(name,content,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function loadStore(key){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function mount(Page){ReactDOM.createRoot(document.getElementById('root')).render(<ConfigProvider locale={locale} button={{autoInsertSpace:false}} theme={{token:{colorPrimary:'#1774ff',borderRadius:2,controlHeight:32,fontSize:14,colorText:'#262626',colorBorder:'#d9d9d9',colorBgLayout:'#f4f5f7',fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif'},components:{Form:{itemMarginBottom:24},Table:{cellPaddingBlock:12,cellPaddingInline:12,headerBg:'#f2f3f5',rowHoverBg:'#fafafa'},Modal:{borderRadiusLG:2},Button:{primaryShadow:'none'}}}}><AntApp><Page/></AntApp></ConfigProvider>)}

const names=['深圳市宜春新材料有限公司','杭州云启数字科技有限公司','广州瑞丰供应链有限公司','深圳市智远精密制造有限公司','杭州禾木文化传播有限公司','广州景行医疗器械有限公司','深圳市华盛新材料股份有限公司'];
const records=Array.from({length:35},(_,i)=>({key:i+1,name:names[i%7],code:'91440300MA5D'+String(100000+i),branch:['深圳分行','杭州分行','广州分行'][i%3],manager:['林晓','陈思远','王一宁'][i%3],status:['待审批','已通过','已驳回'][i%3],amount:80000+i*1397,contact:['张明','李静','刘洋'][i%3],phone:'1380013'+String(8000+i),date:`2026-11-${String(i%10+1).padStart(2,'0')}`,industry:['制造业','信息技术','现代服务'][i%3],grade:['A1','A2','B1'][i%3],source:['手工录入','批量导入'][i%2]}));
function Page(){const {message,modal}=AntApp.useApp();const [form]=Form.useForm(),[editForm]=Form.useForm();const [data,setData]=useState(records),[query,setQuery]=useState({}),[expanded,setExpanded]=useState(false),[cols,setCols]=useState(3),[keys,setKeys]=useState([]),[loading,setLoading]=useState(false),[detail,setDetail]=useState(null),[edit,setEdit]=useState(null),[density,setDensity]=useState('normal'),[current,setCurrent]=useState(1),[size,setSize]=useState(10),[visible,setVisible]=useState(['name','branch','manager','status','amount','date']);
 useEffect(()=>{const resize=()=>setCols(innerWidth>=1800?5:innerWidth>=1500?4:innerWidth>=1200?3:innerWidth>=760?2:1);resize();addEventListener('resize',resize);return()=>removeEventListener('resize',resize)},[]);
 const fieldDefs=[['name','企业名称',<Input allowClear placeholder="请输入企业名称"/>],['branch','所属分行',<Select allowClear placeholder="请选择" options={['深圳分行','广州分行','杭州分行'].map(value=>({value,label:value}))}/>],['status','审批状态',<Select allowClear placeholder="请选择" options={['待审批','已通过','已驳回'].map(value=>({value,label:value}))}/>],['period','申请日期',<RangePicker placeholder={['开始日期','结束日期']} style={{width:'100%'}}/>],['manager','客户经理',<Select allowClear placeholder="请选择" options={['林晓','陈思远','王一宁'].map(value=>({value,label:value}))}/>],['industry','行业分类',<Select allowClear placeholder="请选择" options={['制造业','信息技术','现代服务'].map(value=>({value,label:value}))}/>],['code','企业代码',<Input allowClear placeholder="请输入企业代码"/>],['contact','联系人',<Input allowClear placeholder="请输入联系人"/>],['grade','客户分层',<Select allowClear placeholder="请选择" options={['A1','A2','B1'].map(value=>({value,label:value}))}/>],['source','数据来源',<Select allowClear placeholder="请选择" options={['手工录入','批量导入'].map(value=>({value,label:value}))}/>],['phone','联系电话',<Input allowClear placeholder="请输入联系电话"/>]];
 const filtered=data.filter(r=>Object.entries(query).every(([k,v])=>{if(!v)return true;if(k==='period')return dayjs(r.date).valueOf()>=v[0].startOf('day').valueOf()&&dayjs(r.date).valueOf()<=v[1].endOf('day').valueOf();return String(r[k]).includes(String(v).trim())}));
 const run=()=>{setLoading(true);setQuery(form.getFieldsValue(true));setCurrent(1);setKeys([]);setTimeout(()=>setLoading(false),350)};
 const remove=r=>modal.confirm({title:'确认删除该企业？',content:r.name,okText:'删除',cancelText:'取消',onOk:()=>{setData(d=>d.filter(x=>x.key!==r.key));setKeys(k=>k.filter(x=>x!==r.key));setCurrent(1);message.success('已删除（本地演示）')}});
 const actions=r=>[{key:'detail',label:'详情',onClick:()=>setDetail(r)},...(r.status!=='已通过'?[{key:'edit',label:'编辑',onClick:()=>{setEdit(r);editForm.setFieldsValue(r)}}]:[]),{key:'copy',label:'复制',onClick:()=>{setData(d=>[{...r,key:Date.now(),name:r.name+'（副本）'},...d]);setCurrent(1);message.success('已复制企业记录')}},{key:'export',label:'导出',onClick:()=>download('企业记录.csv',`企业名称,企业代码,所属分行,审批状态\n${r.name},${r.code},${r.branch},${r.status}`)},...(r.status!=='已通过'?[{key:'delete',label:'删除',onClick:()=>remove(r)}]:[])];
 const defs=[{key:'name',title:'企业名称',dataIndex:'name',width:310,ellipsis:{showTitle:false},render:(v,r)=><Tooltip title={v}><div className="company-cell"><span className="company-avatar">{v.slice(0,2)}</span><Button type="link" style={{padding:0,maxWidth:'calc(100% - 38px)',height:'auto'}} onClick={()=>setDetail(r)}><span className="company-link">{v}</span></Button></div></Tooltip>},{key:'branch',title:'所属分行',dataIndex:'branch',width:140,filters:['深圳分行','广州分行','杭州分行'].map(v=>({text:v,value:v})),onFilter:(v,r)=>v===r.branch},{key:'manager',title:'客户经理',dataIndex:'manager',width:110},{key:'status',title:'审批状态',dataIndex:'status',width:120,render:v=><span><i className="status-dot" style={{background:{'待审批':'#1774ff','已通过':'#00b578','已驳回':'#ff4d4f'}[v]}}/>{v}</span>},{key:'amount',title:'预计金额（元）',dataIndex:'amount',align:'right',width:155,sorter:(a,b)=>a.amount-b.amount,render:v=>v.toLocaleString('zh-CN',{minimumFractionDigits:2})},{key:'date',title:'申请日期',dataIndex:'date',width:140,sorter:(a,b)=>a.date.localeCompare(b.date)}];
 const columns=[{title:'序号',width:65,render:(_,r,i)=>(current-1)*size+i+1},...defs.filter(d=>visible.includes(d.key)),{title:'操作',key:'actions',fixed:'right',width:218,render:(_,r)=>{const a=actions(r);return <Space size={16} className="row-actions">{a.slice(0,3).map(x=><Button key={x.key} type="link" size="small" onClick={x.onClick}>{x.label}</Button>)}{a.length>3&&<Dropdown trigger={['click']} menu={{items:a.slice(3).map(({key,label})=>({key,label})),onClick:({key})=>a.find(x=>x.key===key).onClick()}}><Button type="link" size="small">更多⌄</Button></Dropdown>}</Space>}}];
 const exportAll=()=>download('企业名单.csv','企业名称,企业代码,所属分行,客户经理,审批状态,预计金额,申请日期\n'+filtered.filter(r=>!keys.length||keys.includes(r.key)).map(r=>[r.name,r.code,r.branch,r.manager,r.status,r.amount,r.date].join(',')).join('\n'));
 return <Shell id="filter-table" title="企业经营管理" description="查询企业信息，跟进审批进度与经营记录。"><div className="workarea"><div className="filter-panel"><Form name="enterprise-filters" form={form} colon layout="horizontal"><div className="filter-grid" style={{'--filter-cols':cols}}>{fieldDefs.map(([name,label,control],i)=><Form.Item key={name} name={name} label={label} hidden={!expanded&&i>=cols*2-1}>{control}</Form.Item>)}<div className="filter-actions"><Button type="primary" onClick={run}>查询</Button><Button onClick={()=>{form.resetFields();setQuery({});setCurrent(1);setKeys([])}}>重置</Button><Button type="link" onClick={()=>setExpanded(!expanded)}>{expanded?'收起⌃':'展开⌄'}</Button></div></div></Form></div><div className="table-area"><div className="toolbar"><h2>企业列表 <span className="small muted" style={{fontWeight:400,marginLeft:8}}>共 {filtered.length} 家企业</span></h2><Space wrap><Button onClick={exportAll}>导出{keys.length?'所选':'名单'}</Button><a href="./batch-import.html"><Button type="primary">批量导入</Button></a><Select aria-label="表格密度" value={density} onChange={setDensity} style={{width:122}} options={[{value:'dense',label:'紧凑 40px'},{value:'normal',label:'默认 48px'},{value:'loose',label:'宽松 56px'}]}/><Popover trigger="click" placement="bottomRight" title="列设置" content={<div style={{width:160}}>{defs.map(d=><div key={d.key} style={{padding:'5px 0'}}><Checkbox checked={visible.includes(d.key)} disabled={d.key==='name'} onChange={e=>setVisible(v=>e.target.checked?[...v,d.key]:v.filter(x=>x!==d.key))}>{d.title}</Checkbox></div>)}<Button size="small" type="link" onClick={()=>setVisible(defs.map(x=>x.key))}>恢复默认</Button></div>}><Button>列设置</Button></Popover></Space></div>{keys.length>0&&<div className="selection-bar">已选择 <b>{keys.length}</b> 家企业 <Button type="link" size="small" onClick={()=>setKeys([])}>清空选择</Button></div>}<Table className={density} rowKey="key" columns={columns} dataSource={filtered} loading={loading} rowSelection={{selectedRowKeys:keys,onChange:setKeys,preserveSelectedRowKeys:true,selections:[Table.SELECTION_ALL,Table.SELECTION_INVERT,Table.SELECTION_NONE]}} scroll={{x:1260,y:480}} expandable={{expandedRowRender:r=><Descriptions size="small" column={{xs:1,md:3}} items={[{key:'1',label:'企业代码',children:r.code},{key:'2',label:'联系人',children:r.contact},{key:'3',label:'联系电话',children:r.phone}]}/>}} pagination={{current,pageSize:size,showSizeChanger:true,pageSizeOptions:[10,20,50],showQuickJumper:true,showTotal:(total,range)=>`第 ${range[0]}～${range[1]} 条 / 共 ${total} 条`,onChange:(p,s)=>{setCurrent(p);setSize(s)}}} onChange={(pagination,filters,sorter,extra)=>{if(extra.action==='filter')setCurrent(1)}} locale={{emptyText:<Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="暂无符合条件的企业，请调整筛选条件"/>}}/><div className="footer-note">示例数据仅保存在当前页面，导入与编辑操作为本地演示。</div></div></div><Modal title="企业详情" open={!!detail} onCancel={()=>setDetail(null)} footer={<Button type="primary" onClick={()=>setDetail(null)}>关闭</Button>}><Descriptions column={1} items={detail?Object.entries({企业名称:detail.name,企业代码:detail.code,所属分行:detail.branch,客户经理:detail.manager,审批状态:detail.status,联系人:detail.contact,联系电话:detail.phone,申请日期:detail.date}).map(([label,children])=>({key:label,label,children})):[]}/></Modal><Modal title="编辑企业信息" open={!!edit} onCancel={()=>setEdit(null)} okText="保存" cancelText="取消" onOk={async()=>{try{const v=await editForm.validateFields();setData(d=>d.map(r=>r.key===edit.key?{...r,...v}:r));setEdit(null);message.success('已保存企业信息')}catch{}}}><Form name="enterprise-edit" form={editForm} layout="vertical"><Form.Item label="企业名称" name="name" rules={[{required:true,whitespace:true,message:'请输入企业名称'}]}><Input maxLength={60}/></Form.Item><Form.Item label="联系人" name="contact" rules={[{required:true,whitespace:true,message:'请输入联系人'}]}><Input/></Form.Item><Form.Item label="联系电话" name="phone" rules={[{pattern:/^1[3-9]\d{9}$/,message:'请输入有效的 11 位手机号'},{required:true,message:'请输入联系电话'}]}><Input maxLength={11}/></Form.Item></Form></Modal></Shell>
}mount(Page);

</script></body></html>
