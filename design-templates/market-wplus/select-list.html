<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>选择列表弹窗 · 市场 W+</title><link rel="stylesheet" href="./cdn/reset.css"><link rel="stylesheet" href="./theme.css"></head><body><div id="root"><div class="boot">正在加载市场 W+ 页面…</div></div><noscript>请启用 JavaScript 以使用页面。</noscript>
<script src="./cdn/react.production.min.js"></script><script src="./cdn/react-dom.production.min.js"></script><script src="./cdn/dayjs.min.js"></script><script src="./cdn/antd5.min.js"></script><script src="./cdn/babel.min.js"></script>
<script type="text/babel">

const {useState,useEffect,useRef}=React;
const {App:AntApp,ConfigProvider,Button,Space,Form,Input,InputNumber,Select,Radio,Switch,DatePicker,Upload,Modal,Table,Tag,Alert,Progress,Steps,Result,Descriptions,Dropdown,Popover,Checkbox,Empty,Tooltip,Badge}=antd;
const {RangePicker}=DatePicker;
const {Dragger}=Upload;
const pages=[['batch-import','批量导入'],['basic-form','基础表单'],['complex-form','复杂表单'],['filter-table','筛选表格'],['select-list','选择列表']];
const locale={locale:'zh-cn',Pagination:{items_per_page:'条/页',jump_to:'跳至',jump_to_confirm:'确定',page:'页',prev_page:'上一页',next_page:'下一页',prev_5:'向前 5 页',next_5:'向后 5 页'},Table:{filterTitle:'筛选',filterConfirm:'确定',filterReset:'重置',filterEmptyText:'暂无筛选项',emptyText:'暂无内容',selectAll:'全选当页',selectInvert:'反选当页',selectNone:'清空所有',triggerDesc:'点击降序',triggerAsc:'点击升序',cancelSort:'取消排序'},Select:{notFoundContent:'暂无选项'},Empty:{description:'暂无内容'},DatePicker:{lang:{locale:'zh_CN',placeholder:'请选择日期',rangePlaceholder:['开始日期','结束日期'],today:'今天',now:'此刻',backToToday:'返回今天',ok:'确定',clear:'清除',month:'月',year:'年',timeSelect:'选择时间',dateSelect:'选择日期',monthSelect:'选择月份',yearSelect:'选择年份',decadeSelect:'选择年代',yearFormat:'YYYY年',dateFormat:'YYYY年M月D日',dayFormat:'D日',dateTimeFormat:'YYYY年M月D日 HH时mm分ss秒',monthBeforeYear:false,shortWeekDays:['日','一','二','三','四','五','六'],shortMonths:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']},timePickerLocale:{placeholder:'请选择时间'}}};
function Shell({id,title,description,extra,children}){return <><header className="topbar"><div className="brand"><span className="brand-icon">W⁺</span><div><div className="brand-name">市场</div><div className="brand-sub">Payroll Finance</div></div></div><nav className="nav" aria-label="页面导航">{pages.map(([key,name])=><a key={key} className={key===id?'active':''} aria-current={key===id?'page':undefined} href={'./'+key+'.html'}>{name}</a>)}</nav><div className="profile"><span className="small muted">本地演示</span><span className="avatar">林</span><span>林晓 / 市场运营</span></div></header><main className="page"><div className="breadcrumb">市场经营&nbsp; / &nbsp;<span>{title}</span></div><div className="page-heading"><div><h1>{title}</h1><div className="muted small">{description}</div></div>{extra}</div>{children}</main></>}
function Section({children}){return <h2 className="section-title">{children}</h2>}
function Optional({children}){return <>{children}<span className="optional">（选填）</span></>}
function download(name,content,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function loadStore(key){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function mount(Page){ReactDOM.createRoot(document.getElementById('root')).render(<ConfigProvider locale={locale} button={{autoInsertSpace:false}} theme={{token:{colorPrimary:'#1774ff',borderRadius:2,controlHeight:32,fontSize:14,colorText:'#262626',colorBorder:'#d9d9d9',colorBgLayout:'#f4f5f7',fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif'},components:{Form:{itemMarginBottom:24},Table:{cellPaddingBlock:12,cellPaddingInline:12,headerBg:'#f2f3f5',rowHoverBg:'#fafafa'},Modal:{borderRadiusLG:2},Button:{primaryShadow:'none'}}}}><AntApp><Page/></AntApp></ConfigProvider>)}

const prizes=Array.from({length:35},(_,i)=>({key:i+1,code:'JP'+String(20260001+i),name:['旅行行李箱','金龙鱼盘锦大米','智能运动手环','保温随行杯','无线蓝牙耳机'][i%5],price:[399,59,199,89,299][i%5],stock:80+i*3,description:['轻巧耐用，适用于日常通勤与短途旅行。','优选盘锦大米，规格 5kg，适用于员工福利。','记录日常运动数据，支持多种运动模式。','304 不锈钢内胆，长效保温，规格 500ml。','低延时连接，清晰通话，便携充电收纳。'][i%5]}));
function Page(){const {message}=AntApp.useApp();const [open,setOpen]=useState(true),[mode,setMode]=useState('radio'),[draft,setDraft]=useState([]),[selected,setSelected]=useState([]),[search,setSearch]=useState(''),[query,setQuery]=useState(''),[page,setPage]=useState(1),[size,setSize]=useState(10);const result=prizes.filter(r=>(r.name+r.code).toLowerCase().includes(query.trim().toLowerCase()));
 const launch=()=>{setDraft(selected.map(r=>r.key));setSearch('');setQuery('');setPage(1);setOpen(true)};
 const confirm=()=>{setSelected(prizes.filter(r=>draft.includes(r.key)));setOpen(false);message.success(`已选择 ${draft.length} 项奖品`)};
 const columns=[{title:'奖品编号',dataIndex:'code',width:132},{title:'奖品名称',dataIndex:'name',width:172,render:(v,r)=><div className="company-cell"><span className="company-avatar">{['箱','米','环','杯','耳'][(r.key-1)%5]}</span><span>{v}</span></div>},{title:'市场价（元）',dataIndex:'price',align:'right',width:112,render:v=>v.toFixed(2)},{title:'数量',dataIndex:'stock',align:'right',width:75},{title:'描述',dataIndex:'description',width:210,ellipsis:{showTitle:false},render:v=><Tooltip title={v}>{v}</Tooltip>}];
 return <Shell id="select-list" title="选择活动奖品" description="从奖品库中选择活动所需奖品，支持单选或多选。"><div className="workarea"><div className="select-intro"><Section>活动奖品</Section><div className="muted">为企业福利活动配置奖品，确认后将选择结果回填到当前页面。</div><div className="mode-control"><span>选择方式</span><Radio.Group value={mode} onChange={e=>{setMode(e.target.value);setSelected([]);setDraft([])}} options={[{value:'radio',label:'单选'},{value:'checkbox',label:'多选'}]}/></div><Button type="primary" onClick={launch}>选择奖品</Button><div className="selected-results"><div className="toolbar"><b>已选奖品 <span className="muted">（{selected.length}）</span></b>{selected.length>0&&<Button type="link" size="small" onClick={()=>setSelected([])}>清空全部</Button>}</div>{selected.length?selected.map(r=><div className="result-chip" key={r.key}><div><div><b>{r.name}</b> <span className="muted small">{r.code}</span></div><div className="muted small">市场价 ¥{r.price.toFixed(2)} · 库存 {r.stock} 份</div></div><Button type="link" size="small" onClick={()=>setSelected(s=>s.filter(x=>x.key!==r.key))}>移除</Button></div>):<div className="empty-selection">尚未选择奖品，请点击“选择奖品”添加</div>}</div></div></div><Modal title="选择奖品" width={860} open={open} onCancel={()=>setOpen(false)} onOk={confirm} okText="确定" cancelText="取消" okButtonProps={{disabled:!draft.length}}><Input.Search className="picker-search" placeholder="请输入奖品名称或编号" aria-label="搜索奖品" allowClear value={search} onChange={e=>{setSearch(e.target.value);if(!e.target.value){setQuery('');setPage(1)}}} onSearch={v=>{setQuery(v);setPage(1)}}/><Table rowKey="key" size="middle" columns={columns} dataSource={result} scroll={{x:740}} rowSelection={{type:mode,columnWidth:40,fixed:true,selectedRowKeys:draft,preserveSelectedRowKeys:true,onChange:setDraft}} onRow={r=>({onClick:e=>{if(e.target.closest('button,input,label,a'))return;setDraft(d=>mode==='radio'?[r.key]:d.includes(r.key)?d.filter(k=>k!==r.key):[...d,r.key])}})} pagination={{current:page,pageSize:size,showSizeChanger:true,pageSizeOptions:[10,20],showTotal:(total,range)=>`第 ${range[0]}～${range[1]} 条 / 共 ${total} 条`,onChange:(p,s)=>{setPage(p);setSize(s)}}} locale={{emptyText:<Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="未找到匹配的奖品"/>}}/><div className="picker-summary">已选择 {draft.length} 项奖品{mode==='checkbox'?'，支持跨页保留选择':''}。点击“确定”后回填，取消不改变已有结果。</div></Modal></Shell>
}mount(Page);

</script></body></html>
