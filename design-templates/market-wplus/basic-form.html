<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>基础表单 · 市场 W+</title><link rel="stylesheet" href="./cdn/reset.css"><link rel="stylesheet" href="./theme.css"></head><body><div id="root"><div class="boot">正在加载市场 W+ 页面…</div></div><noscript>请启用 JavaScript 以使用页面。</noscript>
<script src="./cdn/react.production.min.js"></script><script src="./cdn/react-dom.production.min.js"></script><script src="./cdn/dayjs.min.js"></script><script src="./cdn/antd5.min.js"></script><script src="./cdn/babel.min.js"></script>
<script type="text/babel">

const {useState,useEffect,useRef}=React;
const {App:AntApp,ConfigProvider,Button,Space,Form,Input,InputNumber,Select,Radio,Switch,DatePicker,Upload,Modal,Table,Tag,Alert,Progress,Steps,Result,Descriptions,Dropdown,Popover,Checkbox,Empty,Tooltip,Badge}=antd;
const {RangePicker}=DatePicker;
const {Dragger}=Upload;
const pages=[['batch-import','批量导入'],['basic-form','基础表单'],['complex-form','复杂表单'],['filter-table','筛选表格'],['select-list','选择列表']];
const locale={locale:'zh-cn',Pagination:{items_per_page:'条/页',jump_to:'跳至',jump_to_confirm:'确定',page:'页',prev_page:'上一页',next_page:'下一页',prev_5:'向前 5 页',next_5:'向后 5 页'},Table:{filterTitle:'筛选',filterConfirm:'确定',filterReset:'重置',filterEmptyText:'暂无筛选项',emptyText:'暂无内容',selectAll:'全选当页',selectInvert:'反选当页',selectNone:'清空所有',triggerDesc:'点击降序',triggerAsc:'点击升序',cancelSort:'取消排序'},Select:{notFoundContent:'暂无选项'},Empty:{description:'暂无内容'},DatePicker:{lang:{locale:'zh_CN',placeholder:'请选择日期',rangePlaceholder:['开始日期','结束日期'],today:'今天',now:'此刻',backToToday:'返回今天',ok:'确定',clear:'清除',month:'月',year:'年',timeSelect:'选择时间',dateSelect:'选择日期',monthSelect:'选择月份',yearSelect:'选择年份',decadeSelect:'选择年代',yearFormat:'YYYY年',dateFormat:'YYYY年M月D日',dayFormat:'D日',dateTimeFormat:'YYYY年M月D日 HH时mm分ss秒',monthBeforeYear:false,shortWeekDays:['日','一','二','三','四','五','六'],shortMonths:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']},timePickerLocale:{placeholder:'请选择时间'}}};
function Shell({id,title,description,extra,children}){return <><header className="topbar"><div className="brand"><span className="brand-icon">W⁺</span><div><div className="brand-name">市场</div><div className="brand-sub">Payroll Finance</div></div></div><nav className="nav" aria-label="页面导航">{pages.map(([key,name])=><a key={key} className={key===id?'active':''} aria-current={key===id?'page':undefined} href={'./'+key+'.html'}>{name}</a>)}</nav><div className="profile"><span className="small muted">本地演示</span><span className="avatar">林</span><span>林晓 / 市场运营</span></div></header><main className="page"><div className="breadcrumb">市场经营&nbsp; / &nbsp;<span>{title}</span></div><div className="page-heading"><div><h1>{title}</h1><div className="muted small">{description}</div></div>{extra}</div>{children}</main></>}
function Section({children}){return <h2 className="section-title">{children}</h2>}
function Optional({children}){return <>{children}<span className="optional">（选填）</span></>}
function download(name,content,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function loadStore(key){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function mount(Page){ReactDOM.createRoot(document.getElementById('root')).render(<ConfigProvider locale={locale} button={{autoInsertSpace:false}} theme={{token:{colorPrimary:'#1774ff',borderRadius:2,controlHeight:32,fontSize:14,colorText:'#262626',colorBorder:'#d9d9d9',colorBgLayout:'#f4f5f7',fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif'},components:{Form:{itemMarginBottom:24},Table:{cellPaddingBlock:12,cellPaddingInline:12,headerBg:'#f2f3f5',rowHoverBg:'#fafafa'},Modal:{borderRadiusLG:2},Button:{primaryShadow:'none'}}}}><AntApp><Page/></AntApp></ConfigProvider>)}

function Page(){const {message}=AntApp.useApp();const [form]=Form.useForm();const [loading,setLoading]=useState(false),[saved,setSaved]=useState(null);const submit=v=>{setLoading(true);setTimeout(()=>{setLoading(false);setSaved(v);message.success('模板已保存（本地演示）')},500)};
 return <Shell id="basic-form" title="新建经营模板" description="填写模板信息，统一管理企业经营活动。"><div className="workarea"><div className="short-form"><div className="form-intro"><Section>基本信息</Section><div className="small muted">请填写以下信息，标注“选填”的字段可留空。</div></div>{saved&&<Alert style={{marginBottom:24}} type="success" showIcon closable message={`模板“${saved.name}”已保存（本地演示）`}/>}<Form form={form} layout="vertical" requiredMark={false} onFinish={submit} initialValues={{type:'first',immediate:true,isDefault:false}} scrollToFirstError><Form.Item label="模板名称" name="name" rules={[{required:true,whitespace:true,message:'请输入模板名称'}]}><Input maxLength={30} showCount placeholder="请输入模板名称"/></Form.Item><Form.Item label={<Optional>模板描述</Optional>} name="description"><Input.TextArea rows={3} maxLength={300} showCount placeholder="请输入模板描述"/></Form.Item><Form.Item label="外出类型" name="type" tooltip="请选择本次经营活动的主要类型" rules={[{required:true,message:'请选择外出类型'}]}><Radio.Group><Radio.Button value="first">首面进企</Radio.Button><Radio.Button value="existing">存量进企</Radio.Button><Radio.Button value="other">其他</Radio.Button></Radio.Group></Form.Item><Form.Item noStyle shouldUpdate={(p,c)=>p.type!==c.type}>{({getFieldValue})=>getFieldValue('type')==='other'?<Form.Item label="其他类型" name="otherType" rules={[{required:true,whitespace:true,message:'请输入其他类型'}]}><Input maxLength={30} placeholder="如学校、医院、商圈、社区"/></Form.Item>:null}</Form.Item><Form.Item label="所属分行" name="branch" rules={[{required:true,message:'请选择所属分行'}]}><Select placeholder="请选择所属分行" options={['深圳分行','广州分行','杭州分行'].map(value=>({label:value,value}))}/></Form.Item><Form.Item label="计划外出日期" name="date" rules={[{required:true,message:'请选择计划外出日期'}]}><DatePicker placeholder="请选择日期"/></Form.Item><Form.Item label="创建人"><Input value="林晓 / 市场运营" disabled/></Form.Item><Form.Item label="是否立即生效" name="immediate" valuePropName="checked"><Switch checkedChildren="是" unCheckedChildren="否"/></Form.Item><Form.Item label="是否设为默认模板" name="isDefault" valuePropName="checked"><Switch checkedChildren="是" unCheckedChildren="否"/></Form.Item><Space><Button type="primary" htmlType="submit" loading={loading}>提交</Button><Button onClick={()=>{form.resetFields();setSaved(null)}}>重置</Button></Space></Form><div className="footer-note">本页面为本地交互演示，提交结果仅在当前页面展示。</div></div></div></Shell>
}mount(Page);

</script></body></html>
