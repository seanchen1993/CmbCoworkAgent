<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>批量导入 · 市场 W+</title><link rel="stylesheet" href="./cdn/reset.css"><link rel="stylesheet" href="./theme.css"></head><body><div id="root"><div class="boot">正在加载市场 W+ 页面…</div></div><noscript>请启用 JavaScript 以使用页面。</noscript>
<script src="./cdn/react.production.min.js"></script><script src="./cdn/react-dom.production.min.js"></script><script src="./cdn/dayjs.min.js"></script><script src="./cdn/antd5.min.js"></script><script src="./cdn/babel.min.js"></script>
<script type="text/babel">

const {useState,useEffect,useRef}=React;
const {App:AntApp,ConfigProvider,Button,Space,Form,Input,InputNumber,Select,Radio,Switch,DatePicker,Upload,Modal,Table,Tag,Alert,Progress,Steps,Result,Descriptions,Dropdown,Popover,Checkbox,Empty,Tooltip,Badge}=antd;
const {RangePicker}=DatePicker;
const {Dragger}=Upload;
const pages=[['batch-import','批量导入'],['basic-form','基础表单'],['complex-form','复杂表单'],['filter-table','筛选表格'],['select-list','选择列表']];
const locale={locale:'zh-cn',Pagination:{items_per_page:'条/页',jump_to:'跳至',jump_to_confirm:'确定',page:'页',prev_page:'上一页',next_page:'下一页',prev_5:'向前 5 页',next_5:'向后 5 页'},Table:{filterTitle:'筛选',filterConfirm:'确定',filterReset:'重置',filterEmptyText:'暂无筛选项',emptyText:'暂无内容',selectAll:'全选当页',selectInvert:'反选当页',selectNone:'清空所有',triggerDesc:'点击降序',triggerAsc:'点击升序',cancelSort:'取消排序'},Select:{notFoundContent:'暂无选项'},Empty:{description:'暂无内容'},DatePicker:{lang:{locale:'zh_CN',placeholder:'请选择日期',rangePlaceholder:['开始日期','结束日期'],today:'今天',now:'此刻',backToToday:'返回今天',ok:'确定',clear:'清除',month:'月',year:'年',timeSelect:'选择时间',dateSelect:'选择日期',monthSelect:'选择月份',yearSelect:'选择年份',decadeSelect:'选择年代',yearFormat:'YYYY年',dateFormat:'YYYY年M月D日',dayFormat:'D日',dateTimeFormat:'YYYY年M月D日 HH时mm分ss秒',monthBeforeYear:false,shortWeekDays:['日','一','二','三','四','五','六'],shortMonths:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']},timePickerLocale:{placeholder:'请选择时间'}}};
function Shell({id,title,description,extra,children}){return <><header className="topbar"><div className="brand"><span className="brand-icon">W⁺</span><div><div className="brand-name">市场</div><div className="brand-sub">Payroll Finance</div></div></div><nav className="nav" aria-label="页面导航">{pages.map(([key,name])=><a key={key} className={key===id?'active':''} aria-current={key===id?'page':undefined} href={'./'+key+'.html'}>{name}</a>)}</nav><div className="profile"><span className="small muted">本地演示</span><span className="avatar">林</span><span>林晓 / 市场运营</span></div></header><main className="page"><div className="breadcrumb">市场经营&nbsp; / &nbsp;<span>{title}</span></div><div className="page-heading"><div><h1>{title}</h1><div className="muted small">{description}</div></div>{extra}</div>{children}</main></>}
function Section({children}){return <h2 className="section-title">{children}</h2>}
function Optional({children}){return <>{children}<span className="optional">（选填）</span></>}
function download(name,content,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function loadStore(key){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function mount(Page){ReactDOM.createRoot(document.getElementById('root')).render(<ConfigProvider locale={locale} button={{autoInsertSpace:false}} theme={{token:{colorPrimary:'#1774ff',borderRadius:2,controlHeight:32,fontSize:14,colorText:'#262626',colorBorder:'#d9d9d9',colorBgLayout:'#f4f5f7',fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif'},components:{Form:{itemMarginBottom:24},Table:{cellPaddingBlock:12,cellPaddingInline:12,headerBg:'#f2f3f5',rowHoverBg:'#fafafa'},Modal:{borderRadiusLG:2},Button:{primaryShadow:'none'}}}}><AntApp><Page/></AntApp></ConfigProvider>)}

function ImportBox({onReady,onBusy,seed=0}){
 const {message}=AntApp.useApp();const [file,setFile]=useState(null),[progress,setProgress]=useState(0),[mode,setMode]=useState('success');const timer=useRef();
 useEffect(()=>()=>clearInterval(timer.current),[]);
 const clear=()=>{clearInterval(timer.current);setFile(null);setProgress(0);onReady(null);onBusy(false)};
 const begin=(f)=>{if(!/\.(xls|xlsx)$/i.test(f.name)){message.error('请选择 .xls 或 .xlsx 文件');return Upload.LIST_IGNORE}if(f.size>10*1024*1024){message.error('文件大小不能超过 10MB');return Upload.LIST_IGNORE}clearInterval(timer.current);setFile({name:f.name,size:f.size,mode});setProgress(0);onReady(null);onBusy(true);let p=0;timer.current=setInterval(()=>{p+=20;setProgress(p);if(p>=100){clearInterval(timer.current);onBusy(false);onReady({name:f.name,mode,valid:mode==='success'?35:mode==='partial'?30:0,invalid:mode==='success'?0:mode==='partial'?5:35})}},180);return false};
 const ready=file&&progress===100;const m=file?.mode;return <div className="upload-box"><div style={{marginBottom:8}}>批量导入</div>{!file?<Dragger accept=".xls,.xlsx" showUploadList={false} beforeUpload={begin}><div className="upload-symbol">X</div><div>点击或将文件拖拽到这里上传</div><div className="upload-desc">支持扩展名：.xls .xlsx，文件不超过 10MB</div></Dragger>:<>{ready&&<Alert showIcon type={m==='success'?'success':'error'} message={m==='success'?'35 条数据可上传':m==='partial'?'30 条数据可上传，5 条错误数据不可上传':'35 条错误数据不可上传'} description={m!=='success'?<div>请下载错误报告并修改后重新上传。<Button size="small" type="link" onClick={()=>download('导入错误报告.csv','行号,企业名称,错误原因\n'+Array.from({length:m==='partial'?5:35},(_,i)=>`${i+2},示例企业${i+1},${['统一社会信用代码格式错误','企业名称不能为空','企业代码重复','联系人手机号格式错误','所属分行不能为空'][i%5]}`).join('\n'))}>下载错误报告</Button></div>:undefined}/>}<div className="file-card"><span className="excel">X</span><div className="file-info"><div className="file-name">{file.name}</div><div className="small muted">{(file.size/1024).toFixed(2)}KB</div>{!ready&&<Progress percent={progress} size="small" status="active"/>}</div>{ready?<Button type="link" size="small" onClick={clear}>重新上传</Button>:<span className="small muted">正在解析</span>}</div></>}
 <a className="template-link" href="./assets/企业导入模板.xlsx" download>↓ 下载导入模板</a><div className="demo-controls"><span>模拟解析结果</span><Radio.Group size="small" value={mode} disabled={!!file} onChange={e=>setMode(e.target.value)} options={[{label:'全部成功',value:'success'},{label:'部分错误',value:'partial'},{label:'全部错误',value:'error'}]} optionType="button"/></div><div className="footer-note">演示说明：文件仅在本地选择；解析结果与提交为模拟，不会发送文件。</div></div>
}
function Page(){const {message}=AntApp.useApp();const [result,setResult]=useState(null),[busy,setBusy]=useState(false),[open,setOpen]=useState(false),[modalResult,setModalResult]=useState(null),[modalBusy,setModalBusy]=useState(false),[done,setDone]=useState(false),[version,setVersion]=useState(0);const confirm=(r,modal)=>{if(!r?.valid)return;message.success(`本地演示：已导入 ${r.valid} 条企业数据`);if(modal)setOpen(false);else setDone(true)};
 return <Shell id="batch-import" title="批量导入企业" description="通过导入模板批量添加企业名单，支持页面导入与弹窗导入。" extra={<Button onClick={()=>{setModalResult(null);setModalBusy(false);setOpen(true)}}>弹窗批量导入</Button>}><div className="workarea"><div className="panel" style={{borderBottom:'1px solid #e8e8e8'}}><Steps size="small" current={done?2:result?1:0} items={[{title:'上传文件'},{title:'核对解析结果'},{title:'完成导入'}]}/></div>{done?<Result status="success" title="导入完成" subTitle={`本地演示已导入 ${result.valid} 条企业记录，未提交至服务器。`} extra={<Button type="primary" onClick={()=>{setDone(false);setResult(null);setVersion(v=>v+1)}}>继续导入</Button>}/>:<div className="import-layout"><div><Section>上传企业名单</Section><ImportBox key={version} onReady={setResult} onBusy={setBusy}/><div className="line"/><Space><Button type="primary" disabled={!result?.valid||busy} onClick={()=>confirm(result,false)}>确认导入</Button><Button onClick={()=>{setVersion(v=>v+1);setResult(null);setBusy(false)}}>取消</Button></Space></div><aside className="guide"><h3>导入说明</h3><ol><li>下载导入模板，保留模板中的表头与字段顺序。</li><li>填写企业名称、统一社会信用代码、联系人与所属分行。</li><li>选择文件后自动解析，核对可上传数量和错误记录。</li><li>如有错误，请下载错误报告，修改后重新上传。</li></ol><Alert type="info" showIcon message="部分数据错误时，可导入校验通过的记录。"/><div className="line"/><div className="small muted">模板格式</div><div style={{marginTop:8}}><Tag>.xls</Tag><Tag>.xlsx</Tag><span className="muted small">单文件 ≤ 10MB</span></div></aside></div>}</div><Modal title="批量导入" open={open} onCancel={()=>setOpen(false)} width={560} destroyOnHidden okText="确定" cancelText="取消" onOk={()=>confirm(modalResult,true)} okButtonProps={{disabled:!modalResult?.valid||modalBusy}}><ImportBox key={version} onReady={setModalResult} onBusy={setModalBusy}/></Modal></Shell>
}mount(Page);

</script></body></html>
