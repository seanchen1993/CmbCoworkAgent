<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>复杂表单 · 市场 W+</title><link rel="stylesheet" href="./cdn/reset.css"><link rel="stylesheet" href="./theme.css"></head><body><div id="root"><div class="boot">正在加载市场 W+ 页面…</div></div><noscript>请启用 JavaScript 以使用页面。</noscript>
<script src="./cdn/react.production.min.js"></script><script src="./cdn/react-dom.production.min.js"></script><script src="./cdn/dayjs.min.js"></script><script src="./cdn/antd5.min.js"></script><script src="./cdn/babel.min.js"></script>
<script type="text/babel">

const {useState,useEffect,useRef}=React;
const {App:AntApp,ConfigProvider,Button,Space,Form,Input,InputNumber,Select,Radio,Switch,DatePicker,Upload,Modal,Table,Tag,Alert,Progress,Steps,Result,Descriptions,Dropdown,Popover,Checkbox,Empty,Tooltip,Badge}=antd;
const {RangePicker}=DatePicker;
const {Dragger}=Upload;
const pages=[['batch-import','批量导入'],['basic-form','基础表单'],['complex-form','复杂表单'],['filter-table','筛选表格'],['select-list','选择列表']];
const locale={locale:'zh-cn',Pagination:{items_per_page:'条/页',jump_to:'跳至',jump_to_confirm:'确定',page:'页',prev_page:'上一页',next_page:'下一页',prev_5:'向前 5 页',next_5:'向后 5 页'},Table:{filterTitle:'筛选',filterConfirm:'确定',filterReset:'重置',filterEmptyText:'暂无筛选项',emptyText:'暂无内容',selectAll:'全选当页',selectInvert:'反选当页',selectNone:'清空所有',triggerDesc:'点击降序',triggerAsc:'点击升序',cancelSort:'取消排序'},Select:{notFoundContent:'暂无选项'},Empty:{description:'暂无内容'},DatePicker:{lang:{locale:'zh_CN',placeholder:'请选择日期',rangePlaceholder:['开始日期','结束日期'],today:'今天',now:'此刻',backToToday:'返回今天',ok:'确定',clear:'清除',month:'月',year:'年',timeSelect:'选择时间',dateSelect:'选择日期',monthSelect:'选择月份',yearSelect:'选择年份',decadeSelect:'选择年代',yearFormat:'YYYY年',dateFormat:'YYYY年M月D日',dayFormat:'D日',dateTimeFormat:'YYYY年M月D日 HH时mm分ss秒',monthBeforeYear:false,shortWeekDays:['日','一','二','三','四','五','六'],shortMonths:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']},timePickerLocale:{placeholder:'请选择时间'}}};
function Shell({id,title,description,extra,children}){return <><header className="topbar"><div className="brand"><span className="brand-icon">W⁺</span><div><div className="brand-name">市场</div><div className="brand-sub">Payroll Finance</div></div></div><nav className="nav" aria-label="页面导航">{pages.map(([key,name])=><a key={key} className={key===id?'active':''} aria-current={key===id?'page':undefined} href={'./'+key+'.html'}>{name}</a>)}</nav><div className="profile"><span className="small muted">本地演示</span><span className="avatar">林</span><span>林晓 / 市场运营</span></div></header><main className="page"><div className="breadcrumb">市场经营&nbsp; / &nbsp;<span>{title}</span></div><div className="page-heading"><div><h1>{title}</h1><div className="muted small">{description}</div></div>{extra}</div>{children}</main></>}
function Section({children}){return <h2 className="section-title">{children}</h2>}
function Optional({children}){return <>{children}<span className="optional">（选填）</span></>}
function download(name,content,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function loadStore(key){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function mount(Page){ReactDOM.createRoot(document.getElementById('root')).render(<ConfigProvider locale={locale} button={{autoInsertSpace:false}} theme={{token:{colorPrimary:'#1774ff',borderRadius:2,controlHeight:32,fontSize:14,colorText:'#262626',colorBorder:'#d9d9d9',colorBgLayout:'#f4f5f7',fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif'},components:{Form:{itemMarginBottom:24},Table:{cellPaddingBlock:12,cellPaddingInline:12,headerBg:'#f2f3f5',rowHoverBg:'#fafafa'},Modal:{borderRadiusLG:2},Button:{primaryShadow:'none'}}}}><AntApp><Page/></AntApp></ConfigProvider>)}

function Poster({values}){return <div className="phone"><div className="phone-top"><span>9:41</span><span>市场 W+　●●●</span></div><div className="poster-hero"><span className="poster-tag">企业专属 · 福利活动</span><h2>{values.subject||'员工专属福利'}</h2><div className="small">{values.enterprise||'深圳市宜春新材料有限公司'}</div><div className="poster-art"><span className="gift-shape">礼</span><span className="gift-shape">享</span><span className="gift-shape">惠</span></div></div><div className="poster-body"><b>专享好礼</b>{(values.prizes||[]).map((p,i)=><div className="prize-mini" key={i}><span className="prize-icon">礼{i+1}</span><div><div style={{fontSize:12}}>{p?.name||'待填写奖品'}</div><div className="muted" style={{fontSize:10}}>限量 {p?.quantity||0} 份 · ¥{p?.price||0}</div></div></div>)}<p style={{fontSize:11,margin:'14px 0 0',whiteSpace:'pre-wrap',overflowWrap:'anywhere'}}>{values.details||'参与企业专属活动，解锁更多精彩福利。'}</p></div><div className="phone-bottom">活动详情以发布信息为准</div></div>}
const defaults={subject:'员工专属福利',enterprise:'深圳市宜春新材料有限公司',type:'employee',period:[dayjs('2026-11-15'),dayjs('2026-12-15')],budget:50000,poster:true,details:'专属福利，与您同行。活动期间完成指定任务，即可领取精美好礼。',prizes:[{name:'旅行行李箱',quantity:80,price:399},{name:'金龙鱼盘锦大米',quantity:120,price:59}]};
function Page(){const {message}=AntApp.useApp();const [form]=Form.useForm();const [step,setStep]=useState(0),[values,setValues]=useState(defaults),[done,setDone]=useState(false),[preview,setPreview]=useState(false),[busy,setBusy]=useState(false);const sync=()=>setValues(form.getFieldsValue(true));
 const fields=[['subject','enterprise','type','period','budget','details','poster','channels'],['prizes']];
 const validate=async(names)=>{try{await form.validateFields(names,{recursive:true});const v=form.getFieldsValue(true);const total=(v.prizes||[]).reduce((s,p)=>s+(p.quantity||0)*(p.price||0),0);if(names.includes('prizes')&&total>v.budget){form.setFields([{name:'budget',errors:['奖品总金额不能超过活动预算']}]);message.error('奖品总金额不能超过活动预算，请返回修改预算或调整奖品');return false}sync();return true}catch(e){const f=e.errorFields?.[0];message.error(f?.errors?.[0]||'请检查表单内容');if(f)form.scrollToField(f.name,{block:'center'});return false}};
 const next=async()=>{if(await validate(fields[step]))setStep(step+1)};
 const draft=()=>{const v=form.getFieldsValue(true);message[safeStore('market-w-activity',{...v,period:v.period?.map(d=>d?.format('YYYY-MM-DD')),step})?'success':'error']('草稿保存至当前浏览器'+(location.protocol==='file:'?'（受浏览器本地文件存储策略影响）':''))};
 const restore=()=>{const v=loadStore('market-w-activity');if(!v){message.info('当前浏览器暂无草稿');return}const data={...v,period:v.period?.map(d=>dayjs(d))};form.setFieldsValue(data);setValues(data);setStep(Math.min(v.step||0,2));setDone(false);message.success('已恢复草稿')};
 const publish=()=>{setBusy(true);setTimeout(()=>{setBusy(false);setDone(true);message.success('活动已发布（本地演示）')},500)};
 return <Shell id="complex-form" title="新建企业福利活动" description="分步完成活动信息、奖品配置与发布确认，右侧实时预览。" extra={<Button onClick={restore}>恢复草稿</Button>}><div className="workarea"><div className="stepper"><Steps current={done?3:step} size="small" items={[{title:'基础信息'},{title:'配置奖品'},{title:'确认发布'}]}/></div>{done?<Result status="success" title="活动发布完成" subTitle={`“${values.subject}”已完成本地发布演示，未向服务器提交。`} extra={<Button type="primary" onClick={()=>{setDone(false);setStep(0)}}>继续编辑</Button>}/>:<><Form form={form} layout="vertical" requiredMark={false} initialValues={defaults} onValuesChange={sync}><div className="complex-content" style={{display:step===2?'none':undefined}}><div><div style={{display:step===0?'block':'none'}}><Section>活动基本信息</Section><Form.Item label="活动主题" name="subject" rules={[{required:true,whitespace:true,message:'请输入活动主题'}]}><Input maxLength={20} showCount placeholder="请输入活动主题"/></Form.Item><Form.Item label="企业名称" name="enterprise" rules={[{required:true,message:'请选择企业'}]}><Input disabled/></Form.Item><div className="field-grid"><Form.Item label="活动类型" name="type" rules={[{required:true}]}><Select options={[{value:'employee',label:'员工福利'},{value:'customer',label:'客户回馈'}]}/></Form.Item><Form.Item label="活动预算" name="budget" rules={[{required:true,message:'请输入活动预算'}]}><InputNumber min={1} max={10000000} precision={2} addonBefore="¥"/></Form.Item><Form.Item label="活动时间" className="full" name="period" rules={[{required:true,message:'请选择活动开始与结束日期'},{validator:(_,v)=>v?.[0]&&v?.[1]&&!v[1].isAfter(v[0],'day')?Promise.reject(new Error('结束日期必须晚于开始日期')):Promise.resolve()}]}><RangePicker placeholder={['开始日期','结束日期']} style={{width:'100%'}}/></Form.Item></div><Form.Item label={<Optional>活动详情</Optional>} name="details"><Input.TextArea maxLength={300} showCount rows={4} placeholder="请输入活动说明"/></Form.Item><Form.Item label="生成活动海报" name="poster" valuePropName="checked"><Switch checkedChildren="是" unCheckedChildren="否"/></Form.Item><Form.Item noStyle shouldUpdate={(p,c)=>p.poster!==c.poster}>{({getFieldValue})=>!getFieldValue('poster')?<Form.Item label="通知渠道" name="channels" rules={[{required:true,message:'请至少选择一个通知渠道'}]}><Checkbox.Group options={['企业微信','短信','邮件']}/></Form.Item>:null}</Form.Item><Alert showIcon type="info" message="活动信息将同步呈现在右侧预览中。"/></div><div style={{display:step===1?'block':'none'}}><Section>配置活动奖品</Section><div className="muted small" style={{marginBottom:20}}>最多添加 5 项奖品，奖品总金额不能超过活动预算。</div><Form.List name="prizes" rules={[{validator:(_,v)=>v?.length?Promise.resolve():Promise.reject(new Error('请至少添加一项奖品'))}]}>{(fields,{add,remove},{errors})=><>{fields.map((field,i)=><div className="prize-card" key={field.key}><div className="prize-card-head"><b>奖品 {i+1}</b><Button type="link" size="small" onClick={()=>{remove(field.name);setTimeout(sync,0)}}>删除</Button></div><Form.Item label="奖品名称" name={[field.name,'name']} rules={[{required:true,whitespace:true,message:'请输入奖品名称'}]}><Input maxLength={30} placeholder="请输入奖品名称"/></Form.Item><div className="prize-fields"><Form.Item label="数量（份）" name={[field.name,'quantity']} rules={[{required:true,message:'请输入奖品数量'}]}><InputNumber min={1} max={100000} precision={0}/></Form.Item><Form.Item label="单价（元）" name={[field.name,'price']} rules={[{required:true,message:'请输入奖品单价'}]}><InputNumber min={.01} max={1000000} precision={2}/></Form.Item></div></div>)}<Form.ErrorList errors={errors}/><Button block type="dashed" disabled={fields.length>=5} onClick={()=>{add({name:'',quantity:1,price:1});setTimeout(sync,0)}}>＋ 添加奖品（{fields.length}/5）</Button></>}</Form.List><div className="line"/><Descriptions column={1} size="small" items={[{key:'budget',label:'活动预算',children:`¥${Number(values.budget||0).toLocaleString()}`},{key:'cost',label:'奖品总金额',children:<b style={{color:(values.prizes||[]).reduce((s,p)=>s+(p?.quantity||0)*(p?.price||0),0)>(values.budget||0)?'#ff4d4f':'#262626'}}>¥{(values.prizes||[]).reduce((s,p)=>s+(p?.quantity||0)*(p?.price||0),0).toLocaleString()}</b>}]}/></div></div><aside className="preview-wrap"><div className="preview-caption">活动海报 · 实时预览</div>{values.poster?<Poster values={values}/>:<div className="empty-selection">已关闭海报生成</div>}</aside></div></Form>{step===2&&<div className="confirm-content"><Section>确认活动信息</Section><Alert type="info" showIcon message="请核对以下信息，发布操作仅在本地演示。" style={{marginBottom:24}}/><Descriptions column={1} bordered items={[{key:'1',label:'活动主题',children:values.subject},{key:'2',label:'企业名称',children:values.enterprise},{key:'3',label:'活动时间',children:values.period?.map(d=>d.format('YYYY-MM-DD')).join(' 至 ')},{key:'4',label:'活动预算',children:'¥'+Number(values.budget||0).toLocaleString()},{key:'5',label:'通知方式',children:values.poster?'生成活动海报':values.channels?.join('、')},{key:'6',label:'活动详情',children:values.details||'--'}]}/><div className="line"/><Table rowKey={(_,i)=>i} pagination={false} dataSource={values.prizes||[]} columns={[{title:'奖品名称',dataIndex:'name'},{title:'数量（份）',dataIndex:'quantity',align:'right'},{title:'单价（元）',dataIndex:'price',align:'right'}]}/></div>}<div className="fixed-footer">{step>0&&<Button onClick={()=>setStep(step-1)}>上一步</Button>}<Button type="primary" loading={busy} onClick={step<2?next:publish}>{step<2?'下一步':'确认发布'}</Button><Button onClick={draft}>保存草稿</Button><Button onClick={()=>setPreview(true)}>预览海报</Button></div></>}</div><Modal title="活动海报预览" width={380} open={preview} onCancel={()=>setPreview(false)} footer={<Button type="primary" onClick={()=>setPreview(false)}>关闭</Button>}><Poster values={values}/></Modal></Shell>
}mount(Page);

</script></body></html>
