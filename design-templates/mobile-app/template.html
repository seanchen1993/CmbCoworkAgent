<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动应用</title>
  <style>
    :root{--bg:#e9ecef;--surface:#fff;--fg:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--fg)}
    .phone{width:min(390px,100vw);height:min(844px,100vh);background:var(--surface);border:1px solid #cfd4dc;border-radius:38px;overflow:hidden;box-shadow:0 24px 70px rgba(15,23,42,.18);display:flex;flex-direction:column}
    .status{height:42px;display:flex;align-items:end;justify-content:space-between;padding:0 24px 8px;font-size:12px;font-weight:800}.screen{flex:1;overflow:auto;padding:18px}.nav{height:70px;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center}
    .card{border:1px solid var(--border);border-radius:18px;padding:16px;background:var(--surface)}.cta{height:48px;border:0;border-radius:16px;background:var(--accent);color:white;font-weight:800;width:100%}
    @media(max-width:420px){.phone{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>5G 100%</span></div>
    <main class="screen" id="screen-content">
      <p style="margin:0 0 8px;color:var(--muted);font-weight:700">今日</p>
      <h1 style="margin:0 0 18px;font-size:30px;line-height:1.08">替换为真实移动端任务</h1>
      <div class="card"><p style="margin:0;color:var(--muted);line-height:1.55">根据场景选择 layouts.md 中的结构。</p></div>
      <button class="cta" style="margin-top:18px">继续</button>
    </main>
    <nav class="nav"><span>首页</span><span>任务</span><span>我的</span></nav>
  </div>
  <script>var TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{"accent":"#2563eb"}/*EDITMODE-END*/;function applyTweaks(e){var t=Object.assign({},TWEAK_DEFAULTS,e||{});document.documentElement.style.setProperty("--accent",String(t.accent));}window.addEventListener("message",function(e){if(e.data&&e.data.type==="__set_tweak_keys")applyTweaks(e.data.edits);});window.parent.postMessage({type:"__edit_mode_available"},"*");applyTweaks({});</script>
</body>
</html>
