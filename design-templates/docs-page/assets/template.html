<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文档页面</title><style>:root{--bg:#fff;--surface:#fafafa;--fg:#171717;--muted:#666;--border:#e5e5e5;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg)}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 220px;min-height:100vh}.side,.toc{border-right:1px solid var(--border);padding:24px;background:var(--surface)}.toc{border-right:0;border-left:1px solid var(--border)}article{max-width:760px;padding:48px 36px;margin:0 auto}pre{background:#111;color:#f8f8f8;border-radius:8px;padding:16px;overflow:auto}a{color:var(--accent)}@media(max-width:980px){.layout{grid-template-columns:1fr}.side,.toc{display:none}article{padding:28px 20px}}</style></head><body><div class="layout"><aside class="side"><strong>文档中心</strong><p>开始 / API / 示例</p></aside><article><p style="color:var(--muted);font-weight:800">指南</p><h1>替换为文档主题</h1><p>用清晰段落解释目标、前置条件和结果。</p><pre><code>npm install example</code></pre><h2>下一步</h2><p>添加真实步骤、参数和注意事项。</p></article><aside class="toc">本页目录</aside></div><script>var TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{"accent":"#2563eb"}/*EDITMODE-END*/;function applyTweaks(e){var t=Object.assign({},TWEAK_DEFAULTS,e||{});document.documentElement.style.setProperty("--accent",String(t.accent));}window.addEventListener("message",function(e){if(e.data&&e.data.type==="__set_tweak_keys")applyTweaks(e.data.edits);});window.parent.postMessage({type:"__edit_mode_available"},"*");applyTweaks({});</script></body></html>
