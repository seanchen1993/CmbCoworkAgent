<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简洁演示稿</title><style>:root{--bg:#111;--surface:#fff;--fg:#111;--muted:#666;--border:#ddd;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif}.deck{height:100vh;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.slide{min-width:100vw;height:100vh;scroll-snap-align:start;background:var(--surface);color:var(--fg);padding:6vw;display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--accent);font-weight:900}.slide h1{font-size:clamp(44px,7vw,92px);line-height:1;margin:0}.slide p{font-size:clamp(18px,2vw,28px);line-height:1.45;color:var(--muted);max-width:760px}</style></head><body><main class="deck"><section class="slide"><div class="kicker">01</div><h1>替换为演示稿主题</h1><p>用一句话说明这份演示稿要改变什么判断。</p></section><section class="slide"><div class="kicker">02</div><h1>核心洞察</h1><p>填入证据、趋势或决策建议。</p></section></main><script>var TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{"accent":"#2563eb"}/*EDITMODE-END*/;function applyTweaks(e){var t=Object.assign({},TWEAK_DEFAULTS,e||{});document.documentElement.style.setProperty("--accent",String(t.accent));}window.addEventListener("message",function(e){if(e.data&&e.data.type==="__set_tweak_keys")applyTweaks(e.data.edits);});window.parent.postMessage({type:"__edit_mode_available"},"*");applyTweaks({});</script></body></html>
