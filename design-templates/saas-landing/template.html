<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SaaS 落地页</title><style>:root{--bg:#f8fafc;--surface:#fff;--fg:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid var(--border);background:var(--surface)}main{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:56px 0 72px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}.product{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:18px;min-height:340px}.btn{height:42px;border:0;border-radius:8px;background:var(--fg);color:var(--surface);padding:0 18px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.card{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:18px}@media(max-width:820px){.hero,.grid{grid-template-columns:1fr}.nav{padding:0 18px}}</style></head><body><nav class="nav"><strong>示例 SaaS</strong><button class="btn">开始试用</button></nav><main><section class="hero"><div><p style="color:var(--muted);font-weight:800">替换为目标客户</p><h1 style="font-size:clamp(40px,7vw,72px);line-height:1;margin:0 0 16px">用一个清晰承诺打开页面</h1><p style="color:var(--muted);font-size:18px;line-height:1.7">填入真实价值、场景和成果。</p></div><div class="product">产品截图/工作流区域</div></section><section class="grid"><div class="card">痛点</div><div class="card">能力</div><div class="card">结果</div></section></main><script>var TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{"accent":"#2563eb"}/*EDITMODE-END*/;function applyTweaks(e){var t=Object.assign({},TWEAK_DEFAULTS,e||{});document.documentElement.style.setProperty("--accent",String(t.accent));}window.addEventListener("message",function(e){if(e.data&&e.data.type==="__set_tweak_keys")applyTweaks(e.data.edits);});window.parent.postMessage({type:"__edit_mode_available"},"*");applyTweaks({});</script></body></html>
