<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480">
<rect width="780" height="480" fill="#f8fafc"/>
<defs><marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker></defs>
<text x="390" y="36" text-anchor="middle" style="font: 700 22px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1e293b;">图3  SSRF 防护流程</text>
<rect x="290" y="62" width="200" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" opacity="1"/>
<text x="390" y="94" text-anchor="middle" style="font: 600 15px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1e293b;">用户填写 baseUrl</text>
<rect x="290" y="156" width="200" height="54" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2" opacity="1"/>
<text x="390" y="188" text-anchor="middle" style="font: 600 15px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1e293b;">DNS 解析域名</text>
<rect x="290" y="250" width="200" height="54" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2" opacity="1"/>
<text x="390" y="271" text-anchor="middle" style="font: 600 15px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1e293b;">IP 范围检查</text>
<text x="390" y="289" text-anchor="middle" style="font: 400 13px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #475569;">RFC 1918 / 回环 / Link-local</text>
<rect x="290" y="344" width="200" height="54" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2" opacity="1"/>
<text x="390" y="365" text-anchor="middle" style="font: 600 15px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1e293b;">允许保存配置</text>
<text x="390" y="383" text-anchor="middle" style="font: 400 13px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #475569;">推理端点生效</text>
<rect x="560" y="250" width="180" height="54" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2" opacity="1"/>
