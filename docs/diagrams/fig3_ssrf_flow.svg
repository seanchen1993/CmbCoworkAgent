<line x1="390" y1="116" x2="390" y2="156" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<line x1="390" y1="210" x2="390" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<line x1="390" y1="304" x2="390" y2="344" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<line x1="490" y1="277" x2="558" y2="277" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
<text x="522" y="268" text-anchor="middle" style="font: 400 13px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #475569;">命中私有 IP</text>
<text x="370" y="316" text-anchor="middle" style="font: 400 13px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #475569;">非私有 IP</text>
