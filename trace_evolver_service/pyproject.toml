[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-evolver-service"
version = "0.1.0"
description = "Trace-only skill evolution service for Cowork traces"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "markdown-it-py>=3.0,<4.0",
  "python-frontmatter>=1.1,<2.0",
  "orjson>=3.10,<4.0",
  "httpx>=0.27,<1.0",
  "openai>=1.30,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
trace-evolver = "trace_evolver.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trace_evolver*"]
