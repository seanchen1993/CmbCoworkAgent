          -t "in-flight configuration check|waits for initial configuration publication|actual command shell|native plugin command receipts|published timezone|blocks the actual model graph at zero allowance|enforces macOS private data isolation|Notification Hook approvals independent|permission notifications for questions|local admission isolation|known shell preparation failure|cancels actual .*trusted preparation|prior background preparation error|rejected owned .* admission"

      - name: Test compiled Bot Host with the shipped Node runtime
