      - name: Test Bot isolated checkout commit and reviewed merge
        run: >-
          npx vitest run src/main/bots/workflow-child-runtime.test.ts
          -t "isolated coding child"

      - name: Test compiled Bot Shell with the shipped Node runtime
        run: node tests/run-bot-shell-native.mjs

      - name: Publish pinned Windows text-selection fixture
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((dotnet --version).Trim() -ne '10.0.401') { throw 'The existing fixed native SDK is required' }
          $fixtureRoot = Join-Path $env:RUNNER_TEMP ('cmb-windows-selection-fixture-' + [guid]::NewGuid())
          $source = Join-Path $fixtureRoot 'source'
          $artifacts = Join-Path $fixtureRoot 'artifacts'
          $publish = Join-Path $fixtureRoot 'publish'
          New-Item -ItemType Directory -Path $source | Out-Null
          foreach ($name in @('CMB.NativeSelectionFixture.csproj', 'Program.cs', 'packages.lock.json')) {
            Copy-Item -LiteralPath (Join-Path 'tests/windows-native-selection-fixture' $name) -Destination $source
          }
          $project = Join-Path $source 'CMB.NativeSelectionFixture.csproj'
          dotnet restore $project --locked-mode --artifacts-path $artifacts --runtime win-x64 --property:Configuration=Release --disable-build-servers
          if ($LASTEXITCODE -ne 0) { throw 'Locked fixture restore failed' }
          dotnet publish $project --no-restore --artifacts-path $artifacts --output $publish --configuration Release --runtime win-x64 --disable-build-servers --property:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Strict fixture publish failed' }
          $pin = @'
          import assert from "node:assert/strict"
          import { createReadStream } from "node:fs"
          import { appendFile, lstat, realpath } from "node:fs/promises"
          import { createHash } from "node:crypto"
          import { join } from "node:path"
          assert.equal(process.platform, "win32")
          assert.equal(process.arch, "x64")
          const requested = join(process.argv[1], "CMBDevClaw.NativeSelectionFixture.exe")
          const info = await lstat(requested)
          assert.ok(info.isFile() && !info.isSymbolicLink() && info.size > 0 && info.size <= 256 * 1024 * 1024)
          const entry = await realpath(requested)
          const hash = createHash("sha256")
          for await (const part of createReadStream(entry)) hash.update(part)
          const values = { CMB_BOT_NATIVE_WINDOWS_SELECTION_FIXTURE: entry, CMB_BOT_NATIVE_WINDOWS_SELECTION_FIXTURE_SHA256: hash.digest("hex") }
          for (const [key, value] of Object.entries(values)) {
            assert.ok(value && !/[\r\n\0]/.test(value))
            await appendFile(process.env.GITHUB_ENV, key + "=" + value + "\n", "utf8")
          }
          '@
          node --input-type=module -e $pin $publish
          if ($LASTEXITCODE -ne 0) { throw 'Fixture identity pin failed' }

      - name: Test actual Windows native text selection
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: node tests/run-bot-windows-native-selection.mjs

      - name: Test compiled Bot link preview thumbnails and cancellation
        run: node tests/run-bot-link-preview-native.mjs

      - name: Keep sanitized Windows native gate reports
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bot-windows-native-failure
          path: |
            ${{ runner.temp }}/cmb-native-build-report.json
            ${{ runner.temp }}/cmb-windows-native-acceptance.json
            ${{ runner.temp }}/cmb-windows-selection-report-*/summary.json
            ${{ runner.temp }}/bot-native-shell-report-*/results.json
          if-no-files-found: ignore

      - name: Test owned macOS Shell interruption and independent closure
        if: runner.os == 'macOS'
        run: node tests/run-bot-owned-shell-native.mjs

      - name: Test Bot errors across Electron context isolation
        if: runner.os != 'Linux'
        run: npx tsx tests/bot-ipc-context-bridge.spec.ts

      - name: Test Bot errors across Electron context isolation (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx tsx tests/bot-ipc-context-bridge.spec.ts

  bot-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome and its system dependencies
        run: npx playwright install --with-deps chrome

      - name: Test actual Bot interactions and bounded rendering
        run: xvfb-run -a npm run test:bot:browser

      - name: Keep Bot UI failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-browser-failure
          path: output/bot-*/
          if-no-files-found: ignore
