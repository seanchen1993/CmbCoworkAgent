name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  bot-protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # M152–M154 has Chromium 556160935 (persistent download history crash).
      # Test the official current stable binary instead of a stale runner image.
      - name: Install stable Chrome for Bot browser protocols
        run: npx playwright install chrome

      # These paths carry effects that are intentionally fail-closed: a file
      # selection binds the reviewed DOM identity, a native select is scoped to
      # its human-controlled page, and delivery evidence accepts one forced
      # result envelope. Keep their actual Chromium and transport coverage in
      # the required CI gate rather than relying on a compile-only check.
      - name: Test Bot browser input and delivery protocols
        run: >-
          CMB_BOT_BROWSER_TEST=1 npx vitest run --maxWorkers=1 --minWorkers=1
          src/main/bots/browser-file-upload.test.ts
          src/main/bots/browser-file-upload-tool.test.ts
          src/main/bots/browser-native-select.test.ts
          src/main/bots/computer-provider.test.ts
          src/main/bots/browser-download-lifecycle.test.ts
          src/main/bots/delivery-evidence-review.test.ts
          src/main/bots/delivery-evidence-transport.test.ts

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build sealed Windows Bot native inputs
        if: runner.os == 'Windows'
        timeout-minutes: 60
        uses: ./.github/actions/build-bot-windows-native

      - name: Build
        run: npm run build

      - name: Prepare isolated Windows native acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: node --import tsx tests/prepare-bot-windows-native.mts

      # Native Node storage/lifecycle contracts; no model credentials, browser,
      # macOS Keychain, deployment or external service is required.
      - name: Test Bot storage and lifecycle
        run: >-
          npx vitest run --maxWorkers=1 --minWorkers=1
          src/main/bots/store.test.ts
          src/main/bots/migrations.test.ts
          src/main/bots/deletion-ledger.test.ts
